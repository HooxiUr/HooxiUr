name: generate 3d profile

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: generate 3d contribution svgs
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: HooxiUr

      - name: crop footer stats row from svgs
        run: |
          for f in profile-3d-contrib/*.svg; do
            sed -i -E 's|(<svg[^>]*\sheight=")850(")|\1790\2|; s|(viewBox="0 0 1280 )850(")|\1790\2|' "$f"
          done

      - name: deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: profile-3d-contrib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
